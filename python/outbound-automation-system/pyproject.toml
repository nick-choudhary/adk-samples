[project]
name = "outbound-automation-system"
version = "1.0.0"
description = "Complete automated outbound system with Email, SMS, and Voice calls using Google ADK"
authors = [
    {name = "Your Name", email = "you@company.com"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Core framework
    "google-adk>=1.10.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.108.0",
    "google-genai>=1.9.0",

    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.17",

    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",

    # Google Cloud
    "google-cloud-tasks>=2.16.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-firestore>=2.18.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-secret-manager>=2.20.0",

    # External services
    "sendgrid>=6.11.0",
    "twilio>=9.3.0",
    "requests>=2.32.0",

    # Data processing
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # Web scraping
    "beautifulsoup4>=4.12.0",
    "selenium>=4.26.0",
    "google-search-results>=2.4.2",  # SerpAPI

    # Social media
    "tweepy>=4.14.0",

    # Data enrichment
    "hunter>=3.3.0",
    "clearbit>=0.1.7",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "firebase-admin>=6.5.0",

    # Caching
    "redis>=5.2.0",
    "hiredis>=3.0.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "phonenumbers>=8.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",  # For testing FastAPI
    "faker>=33.0.0",
    "locust>=2.32.0",  # Load testing
]

[project.optional-dependencies]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "isort>=5.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
